# Mosquitto configuration for the local prototype.
#
# One listener, two kinds of client:
#   - anonymous clients (the robots: robot.py has no credential options), and
#   - the "backend" user, authenticated against a hashed password file that is
#     generated at startup by broker/init-secrets.sh (never committed).
#
# The ACL file decides what each may do: anonymous clients may only publish
# telemetry and read commands, so an anonymous client can NOT command a robot.
# Because a password file is configured, a client that presents a username must
# also present the right password; claiming "backend" without it is refused.
#
# DEVELOPMENT ONLY: anonymous access exists because robot.py cannot authenticate.
# Production uses per-device X.509 identities (see docs/DESIGN.md).

listener 1883 0.0.0.0
allow_anonymous true
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/config/acl

# Telemetry is about 120 bytes. Anything far larger is abuse, not data.
max_packet_size 16384
max_queued_messages 1000
max_inflight_messages 100

# Nothing is retained and sessions are clean, so persistence buys nothing here.
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages false
