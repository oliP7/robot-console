# Linux check: the same two commands an evaluator runs, on a native Linux host.
#   make test  all suites in containers (unit, lint, integration on the real stack)
#   make up    the stack comes up with one command and serves the UI and live data
name: ci

on:
  push:
    branches: [main, ci]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Tool versions
        run: |
          uname -a
          docker version
          docker compose version
          make --version | head -1

      - name: Tests (make test)
        run: make test

      - name: Stack comes up with one command (make up)
        run: make up

      - name: Smoke test through nginx
        run: |
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/ | grep -qi "<html"
          curl -fsS http://127.0.0.1:8080/api/config
          # The robot containers must show up as online robots within 30 s.
          for i in $(seq 1 30); do
            online=$(curl -fsS http://127.0.0.1:8080/api/robots \
              | python3 -c 'import json,sys; print(sum(r["online"] for r in json.load(sys.stdin)["robots"]))') || online=0
            echo "online robots: $online"
            [ "$online" -ge 1 ] && exit 0
            sleep 1
          done
          echo "no robot came online" >&2
          exit 1

      - name: Logs on failure
        if: failure()
        run: docker compose -p robot-console logs --tail=200

      - name: Tear down
        if: always()
        run: make clean
